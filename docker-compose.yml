services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    depends_on:
      - kafka
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"

  spark-master:
    image: apache/spark:3.5.8-java17
    restart: unless-stopped
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >-
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port ${SPARK_MASTER_PORT}
      --webui-port ${SPARK_MASTER_WEBUI_PORT}
    ports:
      - "${SPARK_MASTER_PORT}:${SPARK_MASTER_PORT}"
      - "${SPARK_MASTER_WEBUI_PORT}:${SPARK_MASTER_WEBUI_PORT}"
    volumes:
      - ./batch/build/libs:/opt/spark/jobs/batch:ro
      - ./microbatch/build/libs:/opt/spark/jobs/microbatch:ro
      - spark-checkpoints:/opt/spark/checkpoints

  spark-worker:
    image: apache/spark:3.5.8-java17
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >-
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:${SPARK_MASTER_PORT}
      --cores ${SPARK_WORKER_CORES}
      --memory ${SPARK_WORKER_MEMORY}
      --work-dir /opt/spark/work-dir
    volumes:
      - spark-checkpoints:/opt/spark/checkpoints

  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    restart: unless-stopped
    depends_on:
      - kafka
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
          jobmanager.rpc.address: flink-jobmanager
          jobmanager.heap.size: 1024m
          rest.port: 8081
          parallelism.default: ${FLINK_PARALLELISM}
    ports:
      - "8081:8081"
    volumes:
      - ./streaming/build/libs:/opt/flink/usrlib:ro

  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
          jobmanager.rpc.address: flink-jobmanager
          taskmanager.numberOfTaskSlots: ${FLINK_PARALLELISM}
          taskmanager.heap.size: ${FLINK_TASKMANAGER_MEMORY}
    volumes:
      - ./streaming/build/libs:/opt/flink/usrlib:ro

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/sql:/docker-entrypoint-initdb.d:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    depends_on:
      - postgres
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "9187:9187"

  prometheus:
    image: prom/prometheus:v2.49.1
    restart: unless-stopped
    depends_on:
      - kafka-exporter
      - postgres-exporter
      - generator
      - probe
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro

  generator:
    build:
      context: ./generator
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TOPIC_NAME: events
      EVENT_RATE: ${GENERATOR_EVENT_RATE}
      PAYLOAD_SIZE: ${GENERATOR_PAYLOAD_BYTES}
      SCENARIO: ${GENERATOR_SCENARIO}
      PROMETHEUS_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./generator:/app

  probe:
    build:
      context: ./probe
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PROBE_POLL_INTERVAL_MS: ${PROBE_POLL_INTERVAL_MS}
      RESULTS_PATH: /results
      PROMETHEUS_PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./results:/results

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
  spark-checkpoints:
  prometheus-data:
  grafana-data:
