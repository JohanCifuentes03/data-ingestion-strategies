services:
  # ── Message Broker ─────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"

  # ── Compute: Spark ─────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.8-java17
    restart: unless-stopped
    user: root
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >-
      bash -c "mkdir -p /opt/spark/checkpoints && chmod 777 /opt/spark/checkpoints &&
      exec gosu spark /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port ${SPARK_MASTER_PORT}
      --webui-port ${SPARK_MASTER_WEBUI_PORT}"
    ports:
      - "${SPARK_MASTER_PORT}:${SPARK_MASTER_PORT}"
      - "${SPARK_MASTER_WEBUI_PORT}:${SPARK_MASTER_WEBUI_PORT}"
    volumes:
      - ./batch/out/libs:/opt/spark/jobs/batch:ro
      - ./microbatch/out/libs:/opt/spark/jobs/microbatch:ro
      - spark-checkpoints:/opt/spark/checkpoints

  spark-worker:
    image: apache/spark:3.5.8-java17
    restart: unless-stopped
    user: root
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >-
      bash -c "mkdir -p /opt/spark/checkpoints && chmod 777 /opt/spark/checkpoints &&
      exec gosu spark /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:${SPARK_MASTER_PORT}
      --cores ${SPARK_WORKER_CORES}
      --memory ${SPARK_WORKER_MEMORY}
      --work-dir /opt/spark/work-dir"
    volumes:
      - spark-checkpoints:/opt/spark/checkpoints

  # ── Compute: Flink ─────────────────────────────────────────────────
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java17
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
          jobmanager.rpc.address: flink-jobmanager
          jobmanager.memory.process.size: 1024m
          rest.port: 8081
          parallelism.default: ${FLINK_PARALLELISM}
          metrics.reporter.prom.factory: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
          metrics.reporter.prom.port: 9249
    ports:
      - "8081:8081"
      - "9249:9249"
    volumes:
      - ./streaming/out/libs:/opt/flink/usrlib:ro

  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java17
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
          jobmanager.rpc.address: flink-jobmanager
          taskmanager.numberOfTaskSlots: ${FLINK_PARALLELISM}
          taskmanager.memory.process.size: ${FLINK_TASKMANAGER_MEMORY}
          metrics.reporter.prom.factory: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
          metrics.reporter.prom.port: 9249
    ports:
      - "9250:9249"
    volumes:
      - ./streaming/out/libs:/opt/flink/usrlib:ro

  # ── Sink ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "9187:9187"

  # ── Observability ──────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8888:8080"

  prometheus:
    image: prom/prometheus:v2.49.1
    restart: unless-stopped
    depends_on:
      - kafka-exporter
      - postgres-exporter
      - generator
      - probe
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ── Workload ───────────────────────────────────────────────────────
  generator:
    build:
      context: ./generator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TOPIC_NAME: events
      EVENT_RATE: ${GENERATOR_EVENT_RATE}
      PAYLOAD_SIZE: ${GENERATOR_PAYLOAD_BYTES}
      SCENARIO: ${GENERATOR_SCENARIO}
      EVENT_SCHEMA: ${GENERATOR_EVENT_SCHEMA:-}
      RUN_DURATION_SECONDS: ${GENERATOR_RUN_DURATION_SECONDS:-0}
      WARMUP_SECONDS: ${GENERATOR_WARMUP_SECONDS:-30}
      PROMETHEUS_PORT: 8000
    ports:
      - "8000:8000"

  probe:
    build:
      context: ./probe
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PROBE_POLL_INTERVAL_MS: ${PROBE_POLL_INTERVAL_MS}
      RESULTS_PATH: /results
      PROMETHEUS_PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./results:/results

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
  spark-checkpoints:
  prometheus-data:
  grafana-data:
