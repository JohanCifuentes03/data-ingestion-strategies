# ══════════════════════════════════════════════════════════════════
# docker/sink.yml — Capa de Persistencia y Observabilidad (VM-4: node-sink)
#
# Servicios: postgres + prometheus + cadvisor
#
# MODO DISTRIBUIDO (VM-4, IP: 10.0.1.40):
#   source infra/terraform/outputs.env
#   docker compose -f docker/base.yml -f docker/sink.yml up -d
#
# IMPORTANTE: En modo distribuido, Ansible renderiza el archivo
# prometheus.yml desde el template infra/config/prometheus/prometheus.distributed.yml.j2
# con las IPs reales de todos los nodos antes de levantar este servicio.
#
# Los resultados del probe (latency_samples.csv) se escriben en
# /home/ubuntu/data-ingestion-strategies/results/ en esta VM.
# El script collect-results.sh los copia via scp al final del experimento.
# ══════════════════════════════════════════════════════════════════

include:
  - path: ./base.yml

services:
  # ── PostgreSQL 15 (Sink) ───────────────────────────────────────
  postgres:
    image: postgres:15
    restart: unless-stopped
    container_name: tesis-postgres
    networks:
      - benchmark-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-benchmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark}
      POSTGRES_DB: ${POSTGRES_DB:-benchmark}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../config/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benchmark} -d ${POSTGRES_DB:-benchmark}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Prometheus ─────────────────────────────────────────────────
  # En modo distribuido, Ansible coloca prometheus.distributed.yml
  # (renderizado desde template Jinja2) en infra/config/prometheus/prometheus.local.yml
  # antes de levantar este servicio, sobreescribiendo el archivo local.
  # El archivo original prometheus.yml apunta a localhost y solo es
  # válido en modo local (docker-compose.yml raíz).
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    container_name: tesis-prometheus
    networks:
      - benchmark-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      # En modo distribuido: Ansible renderiza prometheus.distributed.yml
      # con IPs reales y lo copia a infra/config/prometheus/prometheus.local.yml antes de up
      - ../../config/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  # ── cAdvisor (métricas de contenedores) ───────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    container_name: tesis-cadvisor
    networks:
      - benchmark-net
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    ports:
      - "8083:8080"
