---
# ══════════════════════════════════════════════════════════════════
# infra/ansible/roles/producer/tasks/main.yml — Nodo producers (VM-1)
#
# IMPORTANTE: Este rol NO levanta Docker. Solo prepara el entorno.
# El generator y el probe los arrancan los scripts de experimento
# bajo demanda para controlar con precisión el ciclo:
#   clean → warmup → run → cooldown → export
#
# Responsabilidades:
#   1. Crear .env con KAFKA_BOOTSTRAP_SERVERS y POSTGRES_HOST correctos
#   2. Construir las imágenes Docker del generator y probe
#      (sin levantar los contenedores)
#   3. Dejar el sistema listo para que scripts/run.sh lo arranque
# ══════════════════════════════════════════════════════════════════

# ── 1. Crear .env del nodo producer ────────────────────────────
- name: "Crear .env con conexiones a broker y sink remotos"
  copy:
    dest: "{{ repo_dest }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: '0600'
    content: |
      COMPOSE_PROJECT_NAME=tesis-ingestion
      # ── PostgreSQL ──────────────────────────────────────────────
      POSTGRES_USER={{ postgres_user }}
      POSTGRES_PASSWORD={{ postgres_password }}
      POSTGRES_DB={{ postgres_db }}
      POSTGRES_PORT={{ postgres_port }}
      # ── Kafka: IP del nodo broker en modo distribuido ───────────
      KAFKA_BROKER_ID={{ kafka_broker_id }}
      KAFKA_PORT=9092
      KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://{{ vm_broker_ip }}:9092
      KAFKA_BOOTSTRAP_SERVERS={{ vm_broker_ip }}:9092
      KAFKA_NUM_PARTITIONS={{ kafka_num_partitions }}
      KAFKA_REPLICATION_FACTOR={{ kafka_replication_factor }}
      # ── Spark ───────────────────────────────────────────────────
      SPARK_MASTER_PORT={{ spark_master_port }}
      SPARK_MASTER_WEBUI_PORT={{ spark_master_webui_port }}
      SPARK_WORKER_CORES={{ spark_worker_cores }}
      SPARK_WORKER_MEMORY={{ spark_worker_memory }}
      SPARK_MASTER_URL=spark://{{ vm_compute_ip }}:{{ spark_master_port }}
      # ── Flink ───────────────────────────────────────────────────
      FLINK_PARALLELISM={{ flink_parallelism }}
      FLINK_TASKMANAGER_MEMORY={{ flink_taskmanager_memory }}
      FLINK_REST_URL=http://{{ vm_compute_ip }}:8081
      # ── Generator: apunta al broker real ────────────────────────
      GENERATOR_EVENT_RATE={{ generator_event_rate }}
      GENERATOR_PAYLOAD_BYTES={{ generator_payload_bytes }}
      GENERATOR_SCENARIO={{ generator_scenario }}
      GENERATOR_RUN_DURATION_SECONDS={{ generator_run_duration }}
      GENERATOR_WARMUP_SECONDS={{ generator_warmup }}
      # ── Probe: apunta al sink real ───────────────────────────────
      POSTGRES_HOST={{ vm_sink_ip }}
      PROBE_POLL_INTERVAL_MS={{ probe_poll_interval_ms }}
      # ── Modo distribuido ─────────────────────────────────────────
      MODE=distributed
      OCI_VM_PRODUCER_IP={{ vm_producers_ip }}
      OCI_VM_BROKER_IP={{ vm_broker_ip }}
      OCI_VM_COMPUTE_IP={{ vm_compute_ip }}
      OCI_VM_SINK_IP={{ vm_sink_ip }}
  tags: [config]

# ── 2. Construir imágenes Docker sin levantar contenedores ───────
- name: "Construir imagen del generator"
  shell: |
    cd {{ repo_dest }}
    docker compose -f docker/base.yml -f docker/producer.yml build generator 2>&1
  become_user: ubuntu
  register: gen_build
  changed_when: "'Successfully built' in gen_build.stdout or 'FINISHED' in gen_build.stdout"
  tags: [docker]

- name: "Construir imagen del probe"
  shell: |
    cd {{ repo_dest }}
    docker compose -f docker/base.yml -f docker/producer.yml build probe 2>&1
  become_user: ubuntu
  register: probe_build
  changed_when: "'Successfully built' in probe_build.stdout or 'FINISHED' in probe_build.stdout"
  tags: [docker]

- name: "Nodo producer listo (esperando scripts de experimento)"
  debug:
    msg: >
      VM-1 preparada. Generator y Probe listos para arrancar.
      Kafka destino: {{ vm_broker_ip }}:9092
      PostgreSQL destino: {{ vm_sink_ip }}:{{ postgres_port }}
      Arrancar con: MODE=distributed bash scripts/experiment.sh --smoke
  tags: [info]
