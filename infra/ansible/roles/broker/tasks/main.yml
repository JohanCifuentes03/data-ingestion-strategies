---
# ══════════════════════════════════════════════════════════════════
# infra/ansible/roles/broker/tasks/main.yml — Nodo broker (VM-2)
#
# Responsabilidades:
#   1. Crear .env con KAFKA_ADVERTISED_LISTENERS apuntando a IP privada
#   2. Levantar docker/broker.yml (zookeeper + kafka + kafka-exporter)
#   3. Esperar que Kafka esté disponible (healthcheck)
#   4. Crear el tópico 'events' con 12 particiones
# ══════════════════════════════════════════════════════════════════

# ── 1. Configurar .env para modo distribuido ────────────────────
- name: "Crear .env con variables del broker"
  copy:
    dest: "{{ repo_dest }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: '0600'
    content: |
      COMPOSE_PROJECT_NAME=tesis-ingestion
      # ── PostgreSQL ──────────────────────────────────────────────
      POSTGRES_USER={{ postgres_user }}
      POSTGRES_PASSWORD={{ postgres_password }}
      POSTGRES_DB={{ postgres_db }}
      POSTGRES_PORT={{ postgres_port }}
      # ── Kafka ───────────────────────────────────────────────────
      KAFKA_BROKER_ID={{ kafka_broker_id }}
      KAFKA_PORT=9092
      # CRÍTICO: IP privada de esta VM para que clientes externos puedan conectar
      KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://{{ vm_broker_ip }}:9092
      KAFKA_BOOTSTRAP_SERVERS={{ vm_broker_ip }}:9092
      KAFKA_NUM_PARTITIONS={{ kafka_num_partitions }}
      KAFKA_REPLICATION_FACTOR={{ kafka_replication_factor }}
      # ── Spark ───────────────────────────────────────────────────
      SPARK_MASTER_PORT={{ spark_master_port }}
      SPARK_MASTER_WEBUI_PORT={{ spark_master_webui_port }}
      SPARK_WORKER_CORES={{ spark_worker_cores }}
      SPARK_WORKER_MEMORY={{ spark_worker_memory }}
      # ── Flink ───────────────────────────────────────────────────
      FLINK_PARALLELISM={{ flink_parallelism }}
      FLINK_TASKMANAGER_MEMORY={{ flink_taskmanager_memory }}
      # ── Generator ───────────────────────────────────────────────
      GENERATOR_EVENT_RATE={{ generator_event_rate }}
      GENERATOR_PAYLOAD_BYTES={{ generator_payload_bytes }}
      GENERATOR_SCENARIO={{ generator_scenario }}
      GENERATOR_RUN_DURATION_SECONDS={{ generator_run_duration }}
      GENERATOR_WARMUP_SECONDS={{ generator_warmup }}
      # ── Probe ────────────────────────────────────────────────────
      PROBE_POLL_INTERVAL_MS={{ probe_poll_interval_ms }}
      # ── Modo distribuido ─────────────────────────────────────────
      MODE=distributed
      OCI_VM_PRODUCER_IP={{ vm_producers_ip }}
      OCI_VM_BROKER_IP={{ vm_broker_ip }}
      OCI_VM_COMPUTE_IP={{ vm_compute_ip }}
      OCI_VM_SINK_IP={{ vm_sink_ip }}
  tags: [config]

# ── 2. Levantar el stack del broker ────────────────────────────
- name: "Construir e iniciar servicios del broker"
  shell: |
    cd {{ repo_dest }}
    docker compose -f docker/base.yml -f docker/broker.yml up -d --build 2>&1
  become_user: ubuntu
  register: broker_up
  changed_when: "'Started' in broker_up.stdout or 'Created' in broker_up.stdout"
  tags: [docker]

# ── 3. Esperar healthcheck de Kafka ────────────────────────────
- name: "Esperar que Kafka esté disponible (máx 90s)"
  shell: |
    docker exec tesis-kafka kafka-broker-api-versions \
      --bootstrap-server localhost:9092 > /dev/null 2>&1
  register: kafka_health
  until: kafka_health.rc == 0
  retries: 18
  delay: 5
  tags: [healthcheck]

- name: "Kafka disponible — crear tópico 'events'"
  shell: |
    docker exec tesis-kafka kafka-topics \
      --create \
      --topic events \
      --partitions {{ kafka_num_partitions }} \
      --replication-factor {{ kafka_replication_factor }} \
      --bootstrap-server localhost:9092 \
      --if-not-exists 2>&1 || true
  become_user: ubuntu
  register: topic_result
  changed_when: "'Created' in topic_result.stdout"
  tags: [kafka]

- name: "Mostrar estado del broker"
  debug:
    msg: "Kafka broker listo en {{ vm_broker_ip }}:9092 — tópico 'events' con {{ kafka_num_partitions }} particiones"
  tags: [kafka]
