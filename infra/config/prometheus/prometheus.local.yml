global:
  scrape_interval:     5s
  evaluation_interval: 5s
  external_labels:
    project: 'tesis-ingestion'

scrape_configs:

  # ── Kafka Exporter ─────────────────────────────────────────────────
  # Expone métricas de Kafka: consumer lag, topic offsets, partitions
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'kafka'

  # ── cAdvisor (Docker containers CPU/Mem/Net/IO) ────────────────────
  # Expone métricas de recursos por contenedor Docker.
  # IMPORTANTE: usar PrometheusText0.0.4 para que Prometheus ignore los
  # timestamps en milisegundos que cAdvisor embebe en sus métricas; con
  # OpenMetrics esos timestamps se interpretan como segundos de época y
  # quedan ~56.000 años en el futuro, haciendo las muestras invisibles.
  - job_name: 'cadvisor'
    scrape_protocols:
      - PrometheusText0.0.4
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # Descartar cgroups raíz "/" y "/docker" — solo conservar contenedores
      # individuales cuyo id tiene la forma /docker/<sha256>.
      - source_labels: [id]
        regex: '/docker/.+|/system.slice/docker-.+\.scope'
        action: keep

  # ── Generator (métricas de producción) ────────────────────────────
  # Expone: generator_events_total, generator_errors_total,
  #         generator_bytes_total, generator_produce_latency_seconds
  - job_name: 'generator'
    static_configs:
      - targets: ['generator:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'generator'

  # ── Probe (métricas de disponibilidad) ────────────────────────────
  # Expone: probe_events_seen_total, probe_poll_latency_seconds,
  #         probe_errors_total
  - job_name: 'probe'
    static_configs:
      - targets: ['probe:8001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'probe'
