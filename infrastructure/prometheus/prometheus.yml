global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  # ── Kafka ──────────────────────────────────────────────────────────
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']

  # ── PostgreSQL ─────────────────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ── Flink (Prometheus Reporter) ────────────────────────────────────
  - job_name: flink-jobmanager
    static_configs:
      - targets: ['flink-jobmanager:9249']

  - job_name: flink-taskmanager
    static_configs:
      - targets: ['flink-taskmanager:9249']

  # ── Workload components ────────────────────────────────────────────
  - job_name: generator
    static_configs:
      - targets: ['generator:8000']

  - job_name: probe
    static_configs:
      - targets: ['probe:8001']

  # ── Container metrics (cAdvisor) ───────────────────────────────────
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
